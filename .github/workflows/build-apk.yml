name: Build APK

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  apk:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: arm32
            platform: android-arm
          - name: arm64
            platform: android-arm64
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: >
          flutter build apk --release
          --target-platform ${{ matrix.platform }}
          --split-debug-info=build/symbols
          --obfuscate
      - run: mv build/app/outputs/flutter-apk/app-release.apk bubby-${{ matrix.name }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: bubby-${{ matrix.name }}
          path: app/bubby-${{ matrix.name }}.apk
