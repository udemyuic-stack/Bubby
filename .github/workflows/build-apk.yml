name: Build APK

on:
  workflow_dispatch:
  push:
    tags: ['v*']
    branches: [claude/zen-thompson-qfzrjr]

jobs:
  apk:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: arm32
            platform: android-arm
          - name: arm64
            platform: android-arm64
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: >
          flutter build apk --release
          --target-platform ${{ matrix.platform }}
          --split-debug-info=build/symbols
          --obfuscate
      - run: mv build/app/outputs/flutter-apk/app-release.apk bubby-${{ matrix.name }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: bubby-${{ matrix.name }}
          path: app/bubby-${{ matrix.name }}.apk

  smoke:
    # Installs an x86_64 build of the same code on an emulator, launches it and keeps the crash log.
    # It also takes screenshots of the native UI and pushes them to the ci-screenshots branch.
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: >
          flutter build apk --release
          --target-platform android-x64
          --split-debug-info=build/symbols
          --obfuscate
      - name: Enable KVM
        working-directory: .
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          ram-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: bash .github/ci-emulator.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-logs
          path: |
            smoke-logcat.txt
            smoke-screen.png
      - name: Publish screenshots
        if: always()
        working-directory: .
        run: |
          [ -d shots ] || exit 0
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          mkdir -p /tmp/shots && cp shots/* /tmp/shots/
          git checkout --orphan ci-shots-tmp
          git rm -rf . > /dev/null 2>&1 || true
          cp /tmp/shots/* .
          git add -f ./*.png ./*.txt
          git commit -q -m "screenshots for ${GITHUB_SHA}"
          git push -f origin HEAD:ci-screenshots
