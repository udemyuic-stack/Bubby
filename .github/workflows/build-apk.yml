name: Build APK

on:
  workflow_dispatch:
  push:
    tags: ['v*']
    branches: [claude/zen-thompson-qfzrjr, main]

jobs:
  build:
    # One APK for every phone: the app has no native code, so the same file runs on 32-bit ARM, 64-bit ARM and x86.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Build the release APK
        working-directory: app
        run: gradle --no-daemon assembleRelease -Pbuddy.code=${{ github.run_number }} -Pbuddy.version=1.0.${{ github.run_number }}
      - run: find app/build/outputs/apk/release -name "*.apk" -print -exec cp {} bubby.apk \;
      - uses: actions/upload-artifact@v4
        with:
          name: bubby
          path: bubby.apk

  smoke:
    timeout-minutes: 20
    # Installs the APK on an emulator, opens every screen and keeps the crash log and screenshots.
    # The screenshots are pushed to the ci-screenshots branch.
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: bubby
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          ram-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -show-kernel -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: timeout 420 bash .github/ci-emulator.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-logs
          path: |
            smoke-logcat.txt
            smoke-screen.png
      - name: Publish screenshots
        if: always()
        run: |
          [ -d shots ] || exit 0
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          mkdir -p /tmp/shots && cp shots/* /tmp/shots/
          git checkout --orphan ci-shots-tmp
          git rm -rf . > /dev/null 2>&1 || true
          cp /tmp/shots/* .
          git add -f ./*.png ./*.txt
          git commit -q -m "screenshots for ${GITHUB_SHA}"
          git push -f origin HEAD:ci-screenshots
