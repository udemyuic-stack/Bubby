name: Build APK

on:
  workflow_dispatch:
  push:
    tags: ['v*']
    branches: [claude/zen-thompson-qfzrjr, claude/phone-agent, main]

jobs:
  build:
    # One APK for every phone: the app has no native code, so the same file runs on 32-bit ARM, 64-bit ARM and x86.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Restore the signing key (secret BUBBY_KEYSTORE_B64, password BUBBY_STORE_PASSWORD)
        env:
          KS_B64: ${{ secrets.BUBBY_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/bubby.jks"
            echo "BUBBY_KEYSTORE=$RUNNER_TEMP/bubby.jks" >> "$GITHUB_ENV"
            echo "Signing with the fixed Bubby key"
          else
            echo "::warning::BUBBY_KEYSTORE_B64 is not set: this APK is signed with a random key and cannot be installed over another build"
          fi
      - name: Build the release APK
        working-directory: app
        env:
          BUBBY_STORE_PASSWORD: ${{ secrets.BUBBY_STORE_PASSWORD }}
        run: gradle --no-daemon assembleRelease -Pbuddy.code=${{ github.run_number }} -Pbuddy.version=1.0.${{ github.run_number }}
      - run: find app/build/outputs/apk/release -name "*.apk" -print -exec cp {} bubby.apk \;
      - name: Show the signing certificate (must be the same in every build, or updates cannot install)
        run: $(ls -d $ANDROID_HOME/build-tools/*/ | tail -1)apksigner verify --print-certs bubby.apk | grep -i "SHA-256"
      - uses: actions/upload-artifact@v4
        with:
          name: bubby
          path: bubby.apk

  smoke:
    # Installs the APK on an emulator and opens one screen per job (in parallel), keeping a screenshot and the log of each.
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        screen: [home, tasks, calendar, settings, more, ai, setup, outfits, music, agents, agents-demo, agents-diff, fun, permissions, runs, home-green, home-blue, tasks-green, settings-blue, more-green, calendar-blue, home-night, tasks-night, settings-night, more-night, home-space, home-halloween, home-forest, home-ocean, home-newyear, tasks-space, tasks-halloween, settings-ocean, calendar-newyear, more-forest, home-ice, tasks-ice, tasks-blue, home-newyear-live, home-space-live, home-green-live, home-ocean-live, home-halloween-live, home-forest-live, home-ice-live, home-blue-live, game-guess, game-rps, game-memory, game-twenty, game-room, fun]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: bubby
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        id: first
        continue-on-error: true   # the emulator sometimes dies on its own (device offline): one more try below
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          ram-size: 3072M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: timeout 420 bash .github/shot-one.sh ${{ matrix.screen }}
      - name: Second try (the emulator died)
        uses: reactivecircus/android-emulator-runner@v2
        if: steps.first.outcome == 'failure'
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          ram-size: 3072M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: timeout 420 bash .github/shot-one.sh ${{ matrix.screen }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shot-${{ matrix.screen }}
          path: shots
          if-no-files-found: warn
          overwrite: true

  publish:
    # Collects the screenshots of every screen on the ci-screenshots branch.
    needs: smoke
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: shot-*
          merge-multiple: true
          path: shots
      - run: |
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          mkdir -p /tmp/shots && find shots -type f -size 0 -delete; cp shots/* /tmp/shots/
          git checkout --orphan ci-shots-tmp
          git rm -rf . > /dev/null 2>&1 || true
          cp /tmp/shots/* .
          git add -f ./*.png ./*.txt ./*.xml
          git commit -q -m "screenshots for ${GITHUB_SHA}"
          git push -f origin HEAD:ci-screenshots
