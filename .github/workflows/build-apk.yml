name: Build APK

on:
  workflow_dispatch:
  push:
    tags: ['v*']
    branches: [claude/zen-thompson-qfzrjr]

jobs:
  apk:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: arm32
            platform: android-arm
          - name: arm64
            platform: android-arm64
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: >
          flutter build apk --release
          --target-platform ${{ matrix.platform }}
          --split-debug-info=build/symbols
          --obfuscate
      - run: mv build/app/outputs/flutter-apk/app-release.apk bubby-${{ matrix.name }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: bubby-${{ matrix.name }}
          path: app/bubby-${{ matrix.name }}.apk

  smoke:
    # Installs an x86_64 build of the same code on an emulator, launches it and keeps the crash log.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: >
          flutter build apk --release
          --target-platform android-x64
          --split-debug-info=build/symbols
          --obfuscate
      - name: Enable KVM
        working-directory: .
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          working-directory: app
          script: |
            adb install -r build/app/outputs/flutter-apk/app-release.apk
            adb logcat -c
            adb shell am start -W -n com.example.buddy/.MainActivity
            sleep 20
            adb logcat -d > ../smoke-logcat.txt
            adb exec-out screencap -p > ../smoke-screen.png
            adb shell pidof com.example.buddy || (echo "APP IS NOT RUNNING"; grep -A40 "FATAL EXCEPTION" ../smoke-logcat.txt | head -80; exit 1)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-logs
          path: |
            smoke-logcat.txt
            smoke-screen.png
