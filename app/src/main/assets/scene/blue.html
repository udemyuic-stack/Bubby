<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}
#w{position:fixed;left:0;top:0;width:100%;height:100%;overflow:hidden}
.a{position:absolute;will-change:transform,opacity}

.ray{top:-5%;height:80%;background:linear-gradient(rgba(255,255,255,.34),rgba(255,255,255,0));transform-origin:50% 0;animation:ray ease-in-out infinite alternate}
@keyframes ray{from{opacity:.35;transform:skewX(-8deg)}to{opacity:.9;transform:skewX(8deg)}}
.bub{bottom:-30px;border-radius:50%;border:1.5px solid rgba(255,255,255,.7);background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.55),rgba(255,255,255,.08));animation:rise linear infinite}
@keyframes rise{0%{transform:translate(0,0);opacity:0}10%{opacity:.9}50%{transform:translate(var(--bx),-55vh)}100%{transform:translate(calc(var(--bx)*-.5),-112vh);opacity:0}}
.wave{left:0;bottom:0;width:200%;height:150px;animation:wave linear infinite}
@keyframes wave{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.kelp{bottom:-4px;transform-origin:50% 100%;animation:kelp ease-in-out infinite alternate}
@keyframes kelp{from{transform:rotate(-4deg) skewX(-3deg)}to{transform:rotate(4deg) skewX(3deg)}}
.fish{animation:swim linear infinite}
@keyframes swim{from{transform:translateX(-80px)}to{transform:translateX(480px)}}
</style></head><body><div id="w"></div><script>
function h(i,k){var x=Math.sin(i*12.9898+k*78.233)*43758.5453;return x-Math.floor(x)}
var W=document.getElementById('w');
function el(cls,css,html){var e=document.createElement('div');e.className='a '+cls;e.style.cssText=css;if(html)e.innerHTML=html;W.appendChild(e);return e}

for(var i=0;i<4;i++){el('ray','left:'+(8+i*24)+'%;width:'+(60+h(i,1)*60)+'px;animation-duration:'+(6+h(i,2)*5)+'s;animation-delay:-'+h(i,3)*6+'s')}
for(var i=0;i<18;i++){var d=8+h(i,4)*22;el('bub','left:'+h(i,5)*100+'%;width:'+d+'px;height:'+d+'px;--bx:'+(h(i,6)*60-30)+'px;animation-duration:'+(9+h(i,7)*9)+'s;animation-delay:-'+h(i,8)*14+'s')}
function wv(color,op,amp){var p='M0 60';for(var x=0;x<=800;x+=100){p+=' Q'+(x+50)+' '+(60-amp)+' '+(x+100)+' 60';if(x<700){}}
 return '<svg width="100%" height="100%" viewBox="0 0 800 150" preserveAspectRatio="none"><path d="M0 60 Q50 '+(60-amp)+' 100 60 T200 60 T300 60 T400 60 T500 60 T600 60 T700 60 T800 60 V150 H0Z" fill="'+color+'" opacity="'+op+'"/></svg>'}
el('wave','height:150px;bottom:-30px;animation-duration:14s',wv('#9fd0ff',.35,26));
el('wave','height:130px;bottom:-34px;animation-duration:9s;animation-direction:reverse',wv('#6fb0ff',.35,22));
el('wave','height:110px;bottom:-38px;animation-duration:6s',wv('#3f7fe8',.4,18));
for(var i=0;i<5;i++){var hgt=90+h(i,9)*90;el('kelp','left:'+(4+i*21+h(i,10)*6)+'%;width:26px;height:'+hgt+'px;animation-duration:'+(3.5+h(i,11)*2.5)+'s;animation-delay:-'+h(i,12)*3+'s;opacity:.42',
 '<svg width="100%" height="100%" viewBox="0 0 26 100" preserveAspectRatio="none"><path d="M13 100 C2 80 24 62 12 42 C2 24 20 12 13 0 C18 14 6 26 16 44 C26 64 4 80 15 100Z" fill="#2f8f8a"/></svg>')}
for(var i=0;i<3;i++){el('fish','top:'+(28+i*17)+'%;left:0;animation-duration:'+(22+i*9)+'s;animation-delay:-'+i*8+'s;opacity:.5',
 '<svg width="34" height="16" viewBox="0 0 34 16"><path d="M2 8C8 0 20 0 26 8C20 16 8 16 2 8Z" fill="#ffd27a"/><path d="M26 8L34 2V14Z" fill="#ffb347"/><circle cx="8" cy="6.5" r="1.2" fill="#223"/></svg>')}
</script></body></html>
