html,body{margin:0}
.stage{min-height:100vh;display:flex;flex-direction:column;align-items:center;gap:12px;padding:12px 8px;box-sizing:border-box;background:var(--page);font-family:'Outfit',sans-serif;transition:background .6s}
.sw{display:flex;gap:4px;padding:4px;border-radius:99px;background:rgba(255,255,255,.12);backdrop-filter:blur(10px)}
.sw button{border:0;background:none;color:#fff;padding:8px 20px;border-radius:99px;font:400 14px 'Outfit',sans-serif;cursor:pointer;transition:.3s}
.sw .a{background:#fff;color:#102}
.fit{position:relative;flex:none}
.wrap{width:390px;height:844px;position:absolute;left:0;top:0;transform-origin:0 0;border-radius:44px;overflow:hidden;isolation:isolate;box-shadow:0 24px 70px rgba(0,0,0,.5)}
.scr{position:absolute;inset:0;display:none}#s-home{display:block}
.an{transform-origin:50% 50%;cursor:pointer}
button,.row,.petal{cursor:pointer;-webkit-tap-highlight-color:transparent}
.nav{z-index:20;transition:translate .5s cubic-bezier(.22,1,.36,1),opacity .4s}
.nav.hide{translate:0 120px;opacity:0;pointer-events:none}
.nav button{position:relative;z-index:1;border:0}
.plate{position:absolute;left:0;top:7px;width:68px;height:54px;border-radius:46% 46% 44% 44%/60% 60% 40% 40%;background:linear-gradient(160deg,rgba(255,255,255,.85),rgba(255,255,255,.35));box-shadow:0 0 18px rgba(var(--glow),.65);transition:transform .5s cubic-bezier(.34,1.3,.64,1);z-index:0}
.fx{position:absolute;inset:0;pointer-events:none;z-index:60}
.dot{position:absolute;width:8px;height:8px;margin:-4px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent)}
.bub{position:absolute;padding:10px 16px;border-radius:20px;max-width:150px;font:300 14px 'Outfit',sans-serif;color:#fff;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.5);backdrop-filter:blur(14px);z-index:5}
.bub.me{right:14px;top:150px}.bub.bot{left:14px;top:200px}
.ov{position:absolute;inset:0;z-index:40;display:none}
.bd{position:absolute;inset:0;background:rgba(var(--dark),.4);backdrop-filter:blur(10px)}
.sheet{position:absolute;left:10px;right:10px;bottom:10px;padding:20px 18px 22px;border-radius:34px;background:linear-gradient(160deg,rgba(255,255,255,.6),rgba(255,255,255,.25));border:1px solid rgba(255,255,255,.7);backdrop-filter:blur(26px);color:var(--ink);box-shadow:0 20px 50px rgba(var(--sh),.35)}
.sheet h3,.sub h2{margin:0 0 14px;font-weight:300;font-size:24px}
.in2{width:100%;box-sizing:border-box;height:48px;border-radius:24px;border:1px solid rgba(255,255,255,.7);background:rgba(255,255,255,.35);padding:0 18px;font:300 16px 'Outfit',sans-serif;color:var(--ink);outline:0;margin-bottom:10px}
.btn{height:48px;border-radius:24px;border:0;padding:0 24px;font:500 15px 'Outfit',sans-serif;color:#fff;background:linear-gradient(135deg,var(--accent2),var(--accent));box-shadow:0 8px 20px rgba(var(--sh),.3)}
.chip{display:inline-block;padding:11px 18px;border-radius:20px;background:rgba(255,255,255,.35);border:1px solid rgba(255,255,255,.7);margin:0 8px 8px 0;cursor:pointer;font-weight:300}
.chip.sel{background:var(--accent);color:#fff}
.sub{position:absolute;inset:0;z-index:30;display:none;background:var(--bg);color:var(--ink);padding:56px 20px 20px;box-sizing:border-box}
.back{width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.7);background:rgba(255,255,255,.35);backdrop-filter:blur(12px);font-size:20px;color:var(--ink);margin-bottom:14px}
.card{padding:16px;border-radius:24px;margin-bottom:10px;display:flex;align-items:center;gap:12px;color:var(--ink)}
.task{padding:14px 16px;border-radius:22px;margin-bottom:10px;gap:12px}
.chk{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid var(--accent);box-sizing:border-box;transition:.3s}
.done .chk{background:var(--accent)}.done .t{text-decoration:line-through;opacity:.5}
.x{margin-left:auto;background:none;border:0;font-size:22px;color:var(--ink2)}
.bar{height:10px;border-radius:5px;background:rgba(255,255,255,.4);overflow:hidden}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent2),var(--accent))}

.stk{font-size:44px;text-align:center;padding:14px 0;border-radius:24px;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}

.wrap{background:var(--bg)}
.scene{position:absolute;inset:-12px;z-index:0;pointer-events:none}
.scr{z-index:1}
.scn{position:absolute;inset:0;width:100%;height:100%;opacity:.11;transition:opacity .6s}
.sc-sway{transform-box:view-box;transform-origin:300px 844px;animation:scSway 7s ease-in-out infinite alternate}
@keyframes scSway{from{transform:rotate(-1.4deg)}to{transform:rotate(1.4deg)}}
.sc-cl{animation:scCl 5.5s ease-in-out infinite alternate}
@keyframes scCl{from{opacity:.75}to{opacity:1}}
.sc-fall{animation:scFall 12s linear infinite}

.sc-bub{animation:scBub 10s linear infinite}
@keyframes scBub{0%{transform:translate(0,0)}25%{transform:translate(8px,-230px)}50%{transform:translate(-6px,-460px)}75%{transform:translate(7px,-690px)}100%{transform:translate(0,-930px)}}

@keyframes bfAnt{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}

.an.wh{animation:skSwim 5.5s ease-in-out infinite}
@keyframes skSwim{0%,100%{transform:translate(-6px,0) rotate(-1.5deg)}50%{transform:translate(6px,-6px) rotate(1.5deg)}}
.sk-tail{transform-box:view-box;transform-origin:40px 72px;animation:skTail .8s ease-in-out infinite alternate}
@keyframes skTail{from{transform:rotate(-15deg) scaleY(.94)}to{transform:rotate(13deg) scaleY(1.04)}}
.sk-fin{transform-box:view-box;transform-origin:98px 88px;animation:skFin 1.6s ease-in-out infinite alternate}

@keyframes skGill{0%,100%{stroke-opacity:.25}50%{stroke-opacity:.8}}
.sk-eye{transform-box:fill-box;transform-origin:50% 50%;animation:skBlink 5s infinite}
@keyframes skBlink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}

.petal{animation:pIdle 6s ease-in-out infinite}
@keyframes pIdle{0%,100%{translate:0 0}50%{translate:0 -5px}}
.rip{position:absolute;width:40px;height:40px;margin:-20px;border-radius:50%;border:2px solid rgba(255,255,255,.85);box-shadow:0 0 18px rgba(var(--glow),.8)}

.splash{position:absolute;inset:0;z-index:80;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(70% 50% at 50% 42%,rgba(var(--dark),.72),rgba(var(--dark),.97));color:#fff;cursor:pointer;font-family:'Outfit',sans-serif}
.sp-pet{position:relative;width:170px;height:136px;scale:1.3;margin-bottom:40px}
.sp-glow{position:absolute;left:-60px;top:-60px;width:290px;height:256px;border-radius:50%;background:radial-gradient(closest-side,rgba(var(--glow2),.6),rgba(var(--glow2),0));filter:blur(10px)}
.sp-name{display:flex;font-weight:200;font-size:46px;letter-spacing:6px}
.sp-name span{display:inline-block}
.sp-sub{margin-top:8px;font-weight:300;font-size:14px;letter-spacing:2px;opacity:.75}
.sp-ring{margin-top:36px;rotate:-90deg}
.sp-ring circle{fill:none;stroke-width:3;stroke-linecap:round}
.sp-track{stroke:rgba(255,255,255,.18)}.sp-prog{stroke:var(--rim);stroke-dasharray:125.7;stroke-dashoffset:125.7;filter:drop-shadow(0 0 4px var(--rim))}
.sp-hint{position:absolute;bottom:42px;font-weight:300;font-size:12px;opacity:.5}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important}}


.stage.ice{--page:#0d131d;--ink:#1a2840;--ink2:#46587a;--accent:#3f6fb0;--accent2:#7fa6d6;--dark:24,34,52;--glow:130,165,215;--glow2:170,200,240;--sh:40,60,95;--eye:#fff;--rim:#e6f0ff;--t1:linear-gradient(145deg,#7fa6d6,#3f6fb0);--t2:linear-gradient(145deg,#8fc1ff,#3d7fc2);--t3:linear-gradient(145deg,#a9b4e6,#5a68b8);--t4:linear-gradient(145deg,#9fd3d6,#3f8f9a);--bg:radial-gradient(90% 40% at 10% 40%,rgba(236,242,250,.85),rgba(236,242,250,0) 70%),radial-gradient(120% 50% at 50% 100%,#6d84a6,rgba(109,132,166,0) 70%),linear-gradient(180deg,#c7d2df 0%,#a8b7ca 45%,#8597b0 100%)}

.gl-berg{transform-box:fill-box;transform-origin:50% 100%;animation:glBerg 5s ease-in-out infinite alternate}

.gl-snow{animation:glSnow 14s linear infinite}

.gl-spark{transform-box:fill-box;transform-origin:50% 50%;animation:glSpark 3.2s ease-in-out infinite}

.an.big{transform-origin:50% 92%;animation:bbFloat 4.8s ease-in-out infinite}

.eye{transform-box:fill-box;transform-origin:50% 100%;animation:bbEye 4.6s ease-in-out infinite}
@keyframes bbEye{0%,86%,100%{transform:scaleY(1)}90%{transform:scaleY(.2)}94%{transform:scaleY(1.2)}}
.glint{opacity:0;animation:bbGlint 5.5s ease-in-out infinite}
@keyframes bbGlint{0%,55%{transform:translateX(38px);opacity:0}65%{opacity:.45}82%{opacity:.35}92%,100%{transform:translateX(132px);opacity:0}}

.scn.rn{opacity:.55}
.raincv{position:absolute;inset:0;width:100%;height:100%;opacity:.55}

.petal.dim,.petal.mid,.petal.on{backdrop-filter:blur(5px) saturate(1.1);-webkit-backdrop-filter:blur(5px) saturate(1.1);overflow:visible}
.petal.dim{background:linear-gradient(160deg,rgba(255,255,255,.22),rgba(190,212,240,.06));border:1px solid rgba(255,255,255,.6);color:#24395c;box-shadow:inset 0 1px 0 rgba(255,255,255,.7),inset 0 0 16px rgba(255,255,255,.25),inset 0 -12px 18px rgba(120,150,200,.18),0 10px 22px rgba(30,50,90,.16)}
.petal.mid{background:linear-gradient(160deg,rgba(255,255,255,.14),rgba(255,255,255,.03));border:1px solid rgba(255,255,255,.5);box-shadow:inset 0 1px 0 rgba(255,255,255,.6),inset 0 0 18px rgba(255,255,255,.16),0 8px 20px rgba(30,50,90,.14)}
.petal.on{background:radial-gradient(circle at 60% 70%,rgba(255,255,255,.62),rgba(255,255,255,.26) 72%);border:1px solid rgba(255,255,255,.9);box-shadow:inset 0 1px 0 #fff,inset 0 0 22px rgba(255,255,255,.5),0 12px 28px rgba(30,50,90,.24),0 0 18px rgba(200,225,255,.4)}

.petal.mid .in{text-shadow:0 1px 8px rgba(20,32,52,.45)}
.petal::after{content:'';position:absolute;inset:0;border-radius:inherit;background:radial-gradient(circle at 24% 70%,rgba(255,255,255,.95) 0 .9px,rgba(150,190,240,.55) 1.4px 2.6px,rgba(60,90,140,.25) 3px,transparent 3.4px),radial-gradient(circle at 72% 32%,rgba(255,255,255,.95) 0 .8px,rgba(150,190,240,.5) 1.2px 2.2px,rgba(60,90,140,.22) 2.6px,transparent 3px),radial-gradient(circle at 62% 78%,rgba(255,255,255,.9) 0 1px,rgba(150,190,240,.5) 1.6px 3px,rgba(60,90,140,.25) 3.4px,transparent 3.8px),radial-gradient(circle at 36% 38%,rgba(255,255,255,.9) 0 .6px,rgba(150,190,240,.45) 1px 1.8px,transparent 2.2px),radial-gradient(circle at 84% 58%,rgba(255,255,255,.9) 0 .7px,rgba(150,190,240,.45) 1.1px 2px,transparent 2.4px),radial-gradient(ellipse 60% 30% at 30% 14%,rgba(255,255,255,.45),transparent 70%);pointer-events:none}
.petal::before{content:'';position:absolute;top:10%;width:5px;height:7px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:radial-gradient(circle at 40% 35%,#fff 0 1px,rgba(150,190,240,.75) 2px,rgba(60,90,140,.35));box-shadow:0 -14px 0 -2px rgba(255,255,255,.18);pointer-events:none;z-index:1;animation:slide 7s ease-in infinite}
.petal:nth-of-type(1)::before{left:30%;animation-delay:-1s}.petal:nth-of-type(2)::before{left:66%;animation-delay:-3.5s}.petal:nth-of-type(3)::before{left:40%;animation-delay:-5s}
.petal:nth-of-type(4)::before{left:58%;animation-delay:-2s}.petal:nth-of-type(5)::before{left:26%;animation-delay:-6s}.petal:nth-of-type(6)::before{left:70%;animation-delay:-4.2s}
@keyframes slide{0%{transform:translateY(0);opacity:0}10%{opacity:1}55%{transform:translateY(8px)}90%{opacity:1}100%{transform:translateY(70px);opacity:0}}
