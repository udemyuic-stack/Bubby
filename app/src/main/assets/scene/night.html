<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}
#w{position:fixed;left:0;top:0;width:100%;height:100%;overflow:hidden}
.a{position:absolute;will-change:transform,opacity}

.star{border-radius:50%;background:#fff;animation:tw ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.15;transform:scale(.6)}50%{opacity:1;transform:scale(1.25)}}
.shoot{width:110px;height:2px;background:linear-gradient(90deg,rgba(255,255,255,0),#fff);transform-origin:100% 50%;opacity:0;animation:shoot linear infinite}
@keyframes shoot{0%{transform:translate(0,0) rotate(24deg);opacity:0}3%{opacity:1}12%{transform:translate(260px,118px) rotate(24deg);opacity:0}100%{opacity:0}}
.aur{border-radius:50%;filter:blur(30px);animation:aur ease-in-out infinite alternate}
@keyframes aur{from{transform:translateX(-30px) scale(1,.9);opacity:.35}to{transform:translateX(30px) scale(1.1,1.1);opacity:.7}}
.moon{border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff,#dfe4ff 60%,#aab4ee);box-shadow:0 0 40px 12px rgba(160,175,255,.4);animation:glow 6s ease-in-out infinite alternate}
@keyframes glow{from{box-shadow:0 0 30px 8px rgba(160,175,255,.3)}to{box-shadow:0 0 50px 16px rgba(160,175,255,.55)}}
</style></head><body><div id="w"></div><script>
function h(i,k){var x=Math.sin(i*12.9898+k*78.233)*43758.5453;return x-Math.floor(x)}
var W=document.getElementById('w');
function el(cls,css,html){var e=document.createElement('div');e.className='a '+cls;e.style.cssText=css;if(html)e.innerHTML=html;W.appendChild(e);return e}

el('aur','left:-10%;top:6%;width:70%;height:22%;background:linear-gradient(90deg,rgba(90,110,255,.0),rgba(120,100,255,.8),rgba(60,200,255,.0));animation-duration:14s');
el('aur','left:30%;top:14%;width:80%;height:18%;background:linear-gradient(90deg,rgba(60,220,200,0),rgba(90,160,255,.7),rgba(180,100,255,0));animation-duration:19s;animation-delay:-6s');
el('moon','right:12%;top:9%;width:46px;height:46px;opacity:.9');
for(var i=0;i<70;i++){var s=1+h(i,1)*2.2;el('star','left:'+h(i,2)*100+'%;top:'+h(i,3)*100+'%;width:'+s+'px;height:'+s+'px;animation-duration:'+(2+h(i,4)*4)+'s;animation-delay:-'+h(i,5)*6+'s')}
for(var i=0;i<2;i++){el('shoot','left:'+(8+i*30)+'%;top:'+(4+i*14)+'%;animation-duration:'+(8+i*5)+'s;animation-delay:'+(i*3.5)+'s')}
</script></body></html>
